services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bancocloud
      POSTGRES_USER: bancocloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/local/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./infra/local/migrations/002_cards_loans.sql:/docker-entrypoint-initdb.d/002_cards_loans.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancocloud"]
      interval: 5s
      retries: 15
  migrate:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["psql", "-h", "db", "-U", "bancocloud", "-d", "bancocloud", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/002_cards_loans.sql"]
    volumes:
      - ./infra/local/migrations/002_cards_loans.sql:/migrations/002_cards_loans.sql:ro
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  core:
    build: .
    env_file: .env
    ports: ["${CORE_BIND_ADDRESS:-127.0.0.1}:${CORE_HOST_PORT:-8080}:8000"]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  fraud:
    build: .
    command: ["uvicorn", "bancocloud.api.fraud:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
  publisher:
    build: .
    command: ["python","-m","bancocloud.publisher"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      fraud: {condition: service_started}
  azure-worker:
    profiles: ["azure"]
    build: .
    command: ["python", "-m", "bancocloud.azure_event_worker"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
  replay:
    profiles: ["tools"]
    build: .
    command: ["python", "-m", "bancocloud.replay", "/app/data/synthetic/transaction_events.jsonl", "--expected", "10000"]
    env_file: .env
    volumes:
      - ./data/synthetic/transaction_events.jsonl:/app/data/synthetic/transaction_events.jsonl:ro
    depends_on:
      fraud: {condition: service_started}
  gate:
    profiles: ["tools"]
    build: .
    command: ["python", "-m", "bancocloud.gates", "--expected", "10000"]
    env_file: .env
    volumes:
      - ./data/synthetic/transaction_events.jsonl:/app/data/synthetic/transaction_events.jsonl:ro
    depends_on:
      db: {condition: service_healthy}
  genai:
    profiles: ["tools"]
    build: .
    command: ["uvicorn", "bancocloud.api.genai:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports: ["127.0.0.1:8082:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; assert json.load(urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
volumes:
  dbdata: {}
